spring.application.name=tech-challenge
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tech_challenge?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tech_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
app.security.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.security.jwt.validity=15m
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
app.seed.evaluation.name=${EVALUATION_USER_NAME:Avaliador Local}
app.seed.evaluation.email=${EVALUATION_USER_EMAIL:avaliador@example.invalid}
app.seed.evaluation.login=${EVALUATION_USER_LOGIN:avaliador}
app.seed.evaluation.password=${EVALUATION_USER_PASSWORD:}
