services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tech-challenge:local
    environment:
      APP_ENV: ${APP_ENV:-LOCAL_NAO_PRODUTIVO}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-tech_challenge}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-tech_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_SECURITY_USER_NAME: ${LOCAL_ADMIN_USER:-local-admin}
      SPRING_SECURITY_USER_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?Defina LOCAL_ADMIN_PASSWORD no arquivo .env}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    init: true

  mysql:
    image: mysql:8.4.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tech_challenge}
      MYSQL_USER: ${DB_USER:-tech_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no arquivo .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
